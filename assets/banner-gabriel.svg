<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1280 550" role="img" aria-labelledby="title desc">
<title id="title"> Gabriel Barcelos — Distinguished Engineer</title>
<desc id="desc">Banner roxo com C, C++, C#, Python, JavaScript, TypeScript, PHP, Rust e Seven caindo em sequência e alinhando-se lado a lado. Adaptado do projeto de banner fornecido por Gabriel Barcelos.</desc>
<defs>
  <radialGradient id="halo"><stop offset="0" stop-color="#a855f7" stop-opacity=".38"/><stop offset=".75" stop-color="#7c3aed" stop-opacity=".07"/><stop offset="1" stop-color="#0a0612" stop-opacity="0"/></radialGradient>
  <linearGradient id="neon"><stop stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
  <linearGradient id="name"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#e0b3ff"/></linearGradient>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#1b3fb8"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#3b9bff"/><stop offset="1" stop-color="#1456b8"/></linearGradient>
  <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#a35cf0"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
  <linearGradient id="python" x2="1" y2="1"><stop offset=".5" stop-color="#3b78b0"/><stop offset=".5" stop-color="#ffd43b"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
  .logo{opacity:0;animation:drop 13s cubic-bezier(.3,0,.5,1) infinite}
  .trail{opacity:0;animation:trail 13s linear infinite}
  .one{animation-delay:.50s}.two{animation-delay:1.35s}.three{animation-delay:2.20s}.four{animation-delay:3.05s}.five{animation-delay:3.90s}.six{animation-delay:4.75s}.seven{animation-delay:5.60s}.eight{animation-delay:6.45s}.nine{animation-delay:7.30s}
  @keyframes drop{
    0%{opacity:0;transform:translateY(-480px)}
    1%{opacity:1;transform:translateY(-480px)}
    7%{opacity:1;transform:translateY(0)}
    9%{transform:translateY(-10px)}
    11%,90%{opacity:1;transform:translateY(0)}
    97%,100%{opacity:0;transform:translateY(0)}
  }
  @keyframes trail{0%{opacity:0}1%{opacity:.6}6.5%{opacity:.4}8%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.logo{animation:none;opacity:1}.trail{display:none}}
</style>
<rect width="1280" height="720" fill="#0a0612"/>
<ellipse cx="640" cy="690" rx="735" ry="405" fill="url(#halo)"/>
<ellipse cx="640" cy="390" rx="610" ry="300" fill="#7c3aed" opacity=".055"/>
<g fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 190H130L230 70H380" opacity=".75"/><path d="M0 214H110L190 118" opacity=".3"/>
  <path d="M1280 150H1140L1070 232H900" opacity=".75"/><path d="M1280 176H1160L1100 246" opacity=".3"/>
  <path d="M1280 430H1190L1100 520H1000" opacity=".6"/><path d="M0 570H150L220 504H390" opacity=".6"/>
  <path d="M1280 610H1130L1070 668H940" opacity=".5"/>
</g>
<g fill="#d8b4fe"><circle cx="380" cy="70" r="4"/><circle cx="900" cy="232" r="4"/><circle cx="1000" cy="520" r="4"/><circle cx="390" cy="504" r="4"/><circle cx="940" cy="668" r="4"/></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
 <text x="640" y="330" fill="#fff" font-size="83" font-weight="700" letter-spacing="-2">Sênior Gabriel <tspan fill="url(#name)">Barcelos</tspan></text>
 <rect x="580" y="361" width="120" height="2" fill="#c084fc"/>
 <text x="640" y="417" fill="#c9c2d8" font-size="28" font-weight="300" letter-spacing="7">Distinguished Engineer</text>
</g>
<g stroke="url(#neon)" stroke-width="4" opacity=".8"><path d="M170 648H1110"/><path d="M240 652H1040" filter="url(#glow)"/></g>
<!-- The positions, timing and palette follow the uploaded HTML/CSS banner. -->
<g class="trail one"><path d="M208 325V560" stroke="#4f8cff" stroke-width="20" opacity=".25"/></g>
<g class="trail two"><path d="M316 325V560" stroke="#3b9bff" stroke-width="20" opacity=".25"/></g>
<g class="trail three"><path d="M424 325V560" stroke="#a855f7" stroke-width="20" opacity=".25"/></g>
<g class="trail four"><path d="M532 325V560" stroke="#4f8cff" stroke-width="20" opacity=".25"/></g>
<g class="trail five"><path d="M640 325V560" stroke="#f7df1e" stroke-width="20" opacity=".25"/></g>
<g class="trail six"><path d="M748 325V560" stroke="#3b9bff" stroke-width="20" opacity=".25"/></g>
<g class="trail seven"><path d="M856 325V560" stroke="#8892d6" stroke-width="20" opacity=".25"/></g>
<g class="trail eight"><path d="M964 325V560" stroke="#d8d8e8" stroke-width="20" opacity=".25"/></g>
<g class="trail nine"><path d="M1072 325V560" stroke="#3ddc84" stroke-width="20" opacity=".25"/></g>
<g class="logo one">
 <path d="M208 546L246 568V613L208 635L170 613V568Z" fill="url(#blue)"/><text x="208" y="610" font-family="Arial,sans-serif" text-anchor="middle" font-size="49" font-weight="700" fill="#fff">C</text>
</g>
<g class="logo two">
 <path d="M316 546L354 568V613L316 635L278 613V568Z" fill="url(#cyan)"/><text x="316" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">C++</text>
</g>
<g class="logo three">
 <path d="M424 546L462 568V613L424 635L386 613V568Z" fill="url(#purple)"/><text x="424" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="35" font-weight="700" fill="#fff">C#</text>
</g>
<g class="logo four">
 <rect x="488" y="546" width="88" height="88" rx="24" fill="url(#python)"/><text x="532" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="37" font-weight="700" fill="#fff">Py</text>
</g>
<g class="logo five">
 <rect x="596" y="546" width="88" height="88" rx="8" fill="#f7df1e"/><text x="640" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="38" font-weight="700" fill="#111">JS</text>
</g>
<g class="logo six">
 <rect x="704" y="546" width="88" height="88" rx="8" fill="#2f74c0"/><text x="748" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">TS</text>
</g>
<g class="logo seven">
 <ellipse cx="856" cy="590" rx="44" ry="30" fill="#6b79b8"/><text x="856" y="601" font-family="Arial,sans-serif" font-size="30" font-style="italic" font-weight="700" text-anchor="middle" fill="#10132a">php</text>
</g>
<g class="logo eight">
 <circle cx="964" cy="590" r="41" fill="#111" stroke="#fff" stroke-dasharray="5 5" stroke-width="5"/><text x="964" y="605" font-family="Arial,sans-serif" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">R</text>
</g>
<g class="logo nine">
 <rect x="1028" y="546" width="88" height="88" rx="20" fill="#111827" stroke="#a855f7" stroke-width="3"/>
 <path d="M1048 563h48v9l-31 36h-14l30-34h-33z" fill="#f8fafc"/><path d="M1082 585h20l-23 38h-17z" fill="#22c55e"/><circle cx="1097" cy="562" r="4" fill="#38bdf8"/>
</g>
</svg>
