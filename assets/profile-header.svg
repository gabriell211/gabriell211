<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Barcelos | Software Engineer</title>
  <desc id="desc">Animated futuristic profile banner with neon purple and cyan circuitry, terminal details and a rotating emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050614"/>
      <stop offset="50%" stop-color="#10122c"/>
      <stop offset="100%" stop-color="#080a19"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="47%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9a9ebf" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#9d91e9" opacity=".25"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="panel"><rect x="26" y="24" width="1148" height="312" rx="22"/></clipPath>
  </defs>
  <style>
    .travel{stroke-dasharray:18 14;animation:travel 12s linear infinite}
    .orbit{transform-origin:981px 177px;animation:spin 22s linear infinite}
    .orbit-reverse{transform-origin:981px 177px;animation:spin 31s linear infinite reverse}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .cursor{animation:blink 1.05s steps(2,start) infinite}
    .float{animation:float 5s ease-in-out infinite}
    .scan{animation:scan 9s linear infinite}
    .spark{animation:twinkle 2.8s ease-in-out infinite alternate}
    .spark.two{animation-delay:1.5s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes travel{to{stroke-dashoffset:-256}}
    @keyframes pulse{50%{opacity:.38}}
    @keyframes blink{to{opacity:0}}
    @keyframes float{50%{transform:translateY(-6px)}}
    @keyframes scan{from{transform:translateY(-360px)}to{transform:translateY(360px)}}
    @keyframes twinkle{to{opacity:.15;transform:scale(.65)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="360" rx="25" fill="url(#background)"/>
  <g clip-path="url(#panel)">
    <rect x="26" y="24" width="1148" height="312" fill="url(#grid)"/>
    <ellipse cx="974" cy="174" rx="280" ry="245" fill="url(#halo)"/>
    <path d="M0 290L160 235H345L450 310H665L776 232H1200" fill="none" stroke="#7c3aed" stroke-width="2" opacity=".25"/>
    <path d="M0 315L182 257H340L460 333H675L787 254H1200" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".25"/>
    <path d="M-20 290L160 235H345L450 310H665L776 232H1220" class="travel" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".8"/>
    <rect class="scan" x="26" y="0" width="1148" height="2" fill="#22d3ee" opacity=".21"/>
    <g class="spark" fill="#a78bfa"><circle cx="755" cy="78" r="3"/><circle cx="1116" cy="278" r="2"/></g>
    <g class="spark two" fill="#67e8f9"><circle cx="827" cy="293" r="2"/><circle cx="1137" cy="83" r="3"/></g>
  </g>
  <rect x="26" y="24" width="1148" height="312" rx="22" fill="none" stroke="#8b5cf6" stroke-opacity=".42" stroke-width="1.5"/>
  <path d="M49 65V46H270M930 46H1150V65M49 292V315H270M930 315H1150V292" fill="none" stroke="url(#neon)" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="76" cy="65" r="5" fill="#22d3ee" class="pulse"/>
    <text x="91" y="71" fill="#a5b4fc" font-size="14" letter-spacing="3" font-weight="700">GABRIEL / PROFILE.EXE</text>
    <text x="78" y="148" fill="#f8faff" font-size="60" font-weight="800" letter-spacing="1.2">GABRIEL BARCELOS</text>
    <rect x="80" y="169" width="573" height="3" rx="2" fill="url(#neon)"/>
    <text x="80" y="207" fill="#67e8f9" font-size="21" font-weight="700" letter-spacing="2">SOFTWARE ENGINEER  /  PRODUCT BUILDER</text>
    <text x="80" y="239" fill="#c4c7e5" font-size="17">Transformando problemas complexos em sistemas que evoluem.</text>
    <text x="80" y="277" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="1.5">&gt; BUILD. AUTOMATE. SHIP.</text>
    <rect x="326" y="262" width="10" height="20" fill="#22d3ee" class="cursor"/>
    <text x="82" y="316" fill="#777eab" font-size="12" letter-spacing="2">FULL STACK  •  DESKTOP  •  INFRASTRUCTURE  •  LOCAL-FIRST</text>
  </g>
  <circle cx="981" cy="177" r="125" fill="none" stroke="#22d3ee" opacity=".35" stroke-dasharray="4 11"/>
  <circle cx="981" cy="177" r="108" fill="#0c1030" stroke="#8b5cf6" stroke-opacity=".65" stroke-width="2"/>
  <g class="orbit">
    <circle cx="981" cy="177" r="119" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="90 190 38 500" stroke-linecap="round"/>
    <circle cx="981" cy="58" r="6" fill="#67e8f9"/>
  </g>
  <g class="orbit-reverse">
    <circle cx="981" cy="177" r="91" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="24 24 150 280"/>
  </g>
  <g class="float">
    <path d="M981 99L1051 137V215L981 255L911 215V137Z" fill="#101634" stroke="url(#neon)" stroke-width="3"/>
    <path d="M981 111L1039 144V208L981 241L923 208V144Z" fill="none" stroke="#22d3ee" stroke-opacity=".2"/>
    <text x="981" y="201" text-anchor="middle" fill="#f5f3ff" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="800">G</text>
  </g>
</svg>