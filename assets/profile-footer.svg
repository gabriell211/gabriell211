<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Build the next version</title>
  <desc id="desc">Animated neon footer highlighting continuous engineering and product development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#050615"/><stop offset=".5" stop-color="#11112d"/><stop offset="1" stop-color="#060b1b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <style>
    .flow{stroke-dasharray:50 25;animation:slide 7s linear infinite}
    .light{animation:blink 2.2s ease-in-out infinite}
    .type{animation:blink 1.05s steps(2,start) infinite}
    @keyframes slide{to{stroke-dashoffset:-300}}
    @keyframes blink{50%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="150" rx="18" fill="url(#bg)"/>
  <rect x="25" y="21" width="1150" height="107" rx="14" fill="none" stroke="#7062ae" stroke-opacity=".5"/>
  <path d="M50 43H1150" stroke="#a78bfa" stroke-opacity=".2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle class="light" cx="76" cy="76" r="6" fill="#22d3ee"/>
    <text x="95" y="82" fill="#8deaff" font-size="14" font-weight="700" letter-spacing="1">SYSTEM ONLINE</text>
    <text x="600" y="82" text-anchor="middle" fill="#f8faff" font-size="25" font-weight="800" letter-spacing="1.2">BUILD THE NEXT VERSION OF WHAT'S POSSIBLE.</text>
    <text x="1120" y="82" text-anchor="end" fill="#b5a9f0" font-size="13" font-weight="700">GABRIELL211</text>
    <text x="600" y="105" text-anchor="middle" fill="#a8b1d0" font-size="13">Código com propósito. Evolução contínua.</text>
  </g>
  <path d="M46 123H1154" stroke="#2a2c50" stroke-width="4" stroke-linecap="round"/>
  <path class="flow" d="M46 123H1154" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
</svg>