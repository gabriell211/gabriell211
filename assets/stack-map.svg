<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 340">
  <title id="title">Gabriel Barcelos stack map</title>
  <desc id="desc">Technology stack grouped by area.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#020617"/>
  <rect x="24" y="24" width="1152" height="292" rx="18" fill="url(#panel)" stroke="#1E293B"/>
  <text x="64" y="72" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Stack principal</text>
  <text x="64" y="104" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Ferramentas escolhidas para criar produtos digitais confiaveis, instalaveis e preparados para evoluir.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="64" y="136" width="328" height="64" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="84" y="162" fill="#38BDF8" font-size="17" font-weight="800">Frontend</text>
      <text x="84" y="187" fill="#E2E8F0" font-size="15">React, Next.js, TypeScript, Tailwind, HTML, CSS</text>
    </g>
    <g>
      <rect x="436" y="136" width="328" height="64" rx="12" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.35"/>
      <text x="456" y="162" fill="#22C55E" font-size="17" font-weight="800">Backend</text>
      <text x="456" y="187" fill="#E2E8F0" font-size="15">Node.js, Python, PHP, APIs REST, automacao</text>
    </g>
    <g>
      <rect x="808" y="136" width="328" height="64" rx="12" fill="#0F172A" stroke="#FACC15" stroke-opacity="0.35"/>
      <text x="828" y="162" fill="#FACC15" font-size="17" font-weight="800">Desktop</text>
      <text x="828" y="187" fill="#E2E8F0" font-size="15">PySide6, Windows, empacotamento, local-first</text>
    </g>
    <g>
      <rect x="64" y="224" width="328" height="64" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="84" y="250" fill="#A78BFA" font-size="17" font-weight="800">Dados</text>
      <text x="84" y="275" fill="#E2E8F0" font-size="15">PostgreSQL, Prisma, modelagem e relatorios</text>
    </g>
    <g>
      <rect x="436" y="224" width="328" height="64" rx="12" fill="#0F172A" stroke="#FB7185" stroke-opacity="0.35"/>
      <text x="456" y="250" fill="#FB7185" font-size="17" font-weight="800">Entrega</text>
      <text x="456" y="275" fill="#E2E8F0" font-size="15">Git, GitHub, Docker, Linux e builds Windows</text>
    </g>
    <g>
      <rect x="808" y="224" width="328" height="64" rx="12" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="828" y="250" fill="#2DD4BF" font-size="17" font-weight="800">Produto</text>
      <text x="828" y="275" fill="#E2E8F0" font-size="15">UX operacional, processos, negocio e suporte</text>
    </g>
  </g>
</svg>
