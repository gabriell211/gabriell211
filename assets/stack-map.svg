<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 354" role="img" aria-labelledby="title desc">
  <title id="title">Tecnologias e ferramentas</title>
  <desc id="desc">Painel futurista animado com seis áreas técnicas: frontend, backend, desktop, dados, infraestrutura e qualidade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08091e"/><stop offset="1" stop-color="#101432"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".17"/></pattern>
  </defs>
  <style>
    .card{animation:fade 5s ease-in-out infinite alternate}
    .card.b{animation-delay:1s}.card.c{animation-delay:2s}
    .bar{stroke-dasharray:40 26;animation:flow 10s linear infinite}
    .led{animation:blink 2.8s ease-in-out infinite}
    .led.b{animation-delay:.9s}.led.c{animation-delay:1.8s}
    @keyframes fade{to{stroke-opacity:.9;fill-opacity:.92}}
    @keyframes flow{to{stroke-dashoffset:-264}}
    @keyframes blink{50%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="354" rx="21" fill="url(#bg)"/>
  <rect width="1200" height="354" rx="21" fill="url(#dots)"/>
  <rect x="24" y="22" width="1152" height="309" rx="17" fill="#070d24" fill-opacity=".7" stroke="#7161b2" stroke-opacity=".35"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="62" y="69" fill="#f8faff" font-size="31" font-weight="800" letter-spacing="1">TECH STACK <tspan fill="#22d3ee">// SYSTEM MODULES</tspan></text>
    <text x="63" y="101" fill="#99a4cc" font-size="16">Tecnologias para construir, integrar, distribuir e manter software em produção.</text>
    <text x="1070" y="69" fill="#a78bfa" font-size="13" font-weight="700">v.2026</text>
  </g>
  <path class="bar" d="M63 116H1137" stroke="url(#line)" stroke-width="2" opacity=".7"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g class="card" stroke-opacity=".45" fill-opacity=".7">
      <rect x="63" y="136" width="342" height="77" rx="13" fill="#131833" stroke="#22d3ee"/>
      <rect x="63" y="136" width="5" height="77" rx="2" fill="#22d3ee"/>
      <circle class="led" cx="375" cy="158" r="4" fill="#22d3ee"/>
      <text x="85" y="163" fill="#67e8f9" font-size="17" font-weight="800">01 / FRONTEND</text>
      <text x="85" y="190" fill="#eef2ff" font-size="15">React • Next.js • TypeScript • Tailwind</text>
    </g>
    <g class="card b" stroke-opacity=".45" fill-opacity=".7">
      <rect x="429" y="136" width="342" height="77" rx="13" fill="#131833" stroke="#a78bfa"/>
      <rect x="429" y="136" width="5" height="77" rx="2" fill="#a78bfa"/>
      <circle class="led b" cx="741" cy="158" r="4" fill="#a78bfa"/>
      <text x="451" y="163" fill="#c4b5fd" font-size="17" font-weight="800">02 / BACKEND</text>
      <text x="451" y="190" fill="#eef2ff" font-size="15">Laravel • Node.js • Rust • REST APIs</text>
    </g>
    <g class="card c" stroke-opacity=".45" fill-opacity=".7">
      <rect x="795" y="136" width="342" height="77" rx="13" fill="#131833" stroke="#f472b6"/>
      <rect x="795" y="136" width="5" height="77" rx="2" fill="#f472b6"/>
      <circle class="led c" cx="1107" cy="158" r="4" fill="#f472b6"/>
      <text x="817" y="163" fill="#f9a8d4" font-size="17" font-weight="800">03 / DESKTOP</text>
      <text x="817" y="190" fill="#eef2ff" font-size="15">Tauri • Rust • PySide6 • Windows/Linux</text>
    </g>
    <g class="card c" stroke-opacity=".45" fill-opacity=".7">
      <rect x="63" y="233" width="342" height="77" rx="13" fill="#131833" stroke="#f472b6"/>
      <rect x="63" y="233" width="5" height="77" rx="2" fill="#f472b6"/>
      <circle class="led b" cx="375" cy="255" r="4" fill="#f472b6"/>
      <text x="85" y="260" fill="#f9a8d4" font-size="17" font-weight="800">04 / DATA LAYER</text>
      <text x="85" y="287" fill="#eef2ff" font-size="15">PostgreSQL • MySQL • Prisma • SQLite</text>
    </g>
    <g class="card" stroke-opacity=".45" fill-opacity=".7">
      <rect x="429" y="233" width="342" height="77" rx="13" fill="#131833" stroke="#22d3ee"/>
      <rect x="429" y="233" width="5" height="77" rx="2" fill="#22d3ee"/>
      <circle class="led" cx="741" cy="255" r="4" fill="#22d3ee"/>
      <text x="451" y="260" fill="#67e8f9" font-size="17" font-weight="800">05 / INFRA &amp; DELIVERY</text>
      <text x="451" y="287" fill="#eef2ff" font-size="15">Linux • GitHub Actions • VPS • CI/CD</text>
    </g>
    <g class="card b" stroke-opacity=".45" fill-opacity=".7">
      <rect x="795" y="233" width="342" height="77" rx="13" fill="#131833" stroke="#a78bfa"/>
      <rect x="795" y="233" width="5" height="77" rx="2" fill="#a78bfa"/>
      <circle class="led c" cx="1107" cy="255" r="4" fill="#a78bfa"/>
      <text x="817" y="260" fill="#c4b5fd" font-size="17" font-weight="800">06 / ENGINEERING</text>
      <text x="817" y="287" fill="#eef2ff" font-size="15">Clean Architecture • Tests • Security</text>
    </g>
  </g>
</svg>